# Type-check, test and build the website on every push and pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # For the Vercel status step: read this run's job results, set a commit status
  actions: read
  statuses: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      # Reports this job's result to Vercel Deployment Checks, which holds production until it passes.
      # Must stay first: it marks the commit pending now and posts success/failure after all steps.
      # The name must match the check configured in Vercel (Settings > Deployment Checks).
      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - heymarkham: lint'

      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in the root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Test FAQ answers
        run: pnpm test

      - name: Build
        run: pnpm build
